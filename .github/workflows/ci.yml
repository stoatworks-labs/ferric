name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# The FFGL plugin on macOS only, and deliberately: on Windows it needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
#
# The OpenFX plugin on macOS AND Windows. On Windows it is built alone, with
# FERRIC_BUILD_FFGL=OFF, which needs nothing but MSVC -- no vcpkg, no GLEW, no
# FFGL SDK -- so it costs a minute and catches the one compiler that would
# otherwise first see the CPU passes at release time. Linux is the release
# workflow's linux-ofx/linux-load pair.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # FERRIC_BUILD_TOOLS is ON here where the release build turns it OFF:
        # frtest is a large slice of the C++ and carries the only mirror of
        # the plugin's maths, so compiling it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DFERRIC_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The checks that need no GL context, which is the set a CI runner can be
      # trusted with: the bar recovery, the depth carve-out, the band split, the
      # weighting curve, the weighted figure and the preset echo are all pure
      # arithmetic. frtest skips context creation entirely when only these are
      # asked for.
      #
      # ☠️ The preset echo one is worth having here specifically. It is the
      # check for a bug that cannot be seen in a picture, cannot be reproduced
      # without a host, and has already shipped in this fleet: Resolume does not
      # consume value events, so a naive factory-preset implementation snaps back
      # to Custom on the host's own echo before the operator has touched
      # anything. It needs no GPU, and it is the one thing here that would
      # otherwise only be found by a user.
      #
      # Everything else in tools/verify.sh renders, and a software GL stack on a
      # hosted runner is not the thing to hang a merge gate on -- those run
      # locally before a tag.
      - name: The arithmetic that needs no GPU
        run: ./build/frtest --drive --weighting --wf --echo

      # The OpenFX bundle names its own binary and exports its entry point. The
      # first is a release-time codesign failure with no local symptom at all --
      # see the comment in cmake/InfoOFX.plist.in -- so it is worth a line here
      # as well as in verify.sh. Captured and matched, never `| grep -q`, which
      # fails under pipefail precisely when it finds what it is looking for.
      - name: OpenFX bundle names its own binary and exports OfxGetPlugin
        run: |
          named=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" \
            build/Ferric.ofx.bundle/Contents/Info.plist)
          test -f "build/Ferric.ofx.bundle/Contents/MacOS/$named"
          echo "CFBundleExecutable is $named, and it is there"
          symbols=$(nm -gU "build/Ferric.ofx.bundle/Contents/MacOS/$named")
          case "$symbols" in
            *_OfxGetPlugin*) echo "exports OfxGetPlugin" ;;
            *) echo "no OfxGetPlugin in $named"; exit 1 ;;
          esac

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: ferric-macos-arm64
          path: |
            build/*.bundle
            build/*.ofx.bundle
          if-no-files-found: error

  windows-ofx:
    runs-on: windows-latest
    steps:
      # No submodules: the FFGL SDK is the only one, and this job does not build
      # FFGL. The OpenFX SDK subset is vendored in-tree.
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DFERRIC_BUILD_FFGL=OFF
          -DFERRIC_BUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel --target FerricOFX

      - name: The plugin is where a host looks for it
        shell: bash
        run: |
          test -f build/Ferric.ofx.bundle/Contents/Win64/Ferric.ofx
          ls -l build/Ferric.ofx.bundle/Contents/Win64
