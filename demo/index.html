  <body>
    <main id="demo">
      <noscript>
        <h1>Ferric</h1>
        <p>
          The video signal put on tape, as an FFGL effect for Resolume. An
          unsteady transport tears the picture in time, the oxide adds its own
          hiss and dropouts, and the consumer sliding-band noise reduction that
          hid one under the other is in there too, with both ends of it under
          your control.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/ferric">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/ferric/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/ferric">Source on GitHub</a></li>
        </ul>
      </noscript>
